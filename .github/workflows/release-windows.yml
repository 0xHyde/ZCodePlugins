name: Release voice runtimes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish, for example v0.1.0"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build SenseVoice.cpp runtime
        run: npm run build:sensevoice -- --ref ${{ vars.ZCODE_SENSEVOICE_REF || 'main' }} --jobs 2

      - name: Build CAM++ ONNX Runtime adapter
        run: npm run build:campp -- --ref ${{ vars.ZCODE_3D_SPEAKER_REF || 'main' }} --ort-version 1.12.0 --jobs 2

      - name: Run JavaScript tests and plugin validation
        shell: cmd
        run: |
          npm run test:voice-transcriber
          if errorlevel 1 exit /b 1
          npm run validate

      - name: Verify Windows runtime files
        run: |
          $runtime = "plugins/voice-transcriber/bin/win32/x64"
          foreach ($file in @("sense-voice-main.exe", "campp-adapter.exe", "onnxruntime.dll")) {
            if (!(Test-Path (Join-Path $runtime $file))) { throw "Runtime file missing: $file" }
          }

      - name: Prepare Windows release assets
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $runtime = "plugins/voice-transcriber/bin/win32/x64"
          $dist = "dist/win32-x64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Compress-Archive -Path "$runtime/*" -DestinationPath "$dist/voice-transcriber-win32-x64.zip"
          Get-ChildItem $runtime -File | Where-Object { $_.Extension -ne ".pdb" } | ForEach-Object {
            Copy-Item $_.FullName -Destination "$dist/win32-x64-$($_.Name)" -Force
          }
          node tools/create-runtime-manifest.mjs `
            --input $runtime `
            --version $env:RELEASE_TAG `
            --repository $env:GITHUB_REPOSITORY `
            --asset-prefix "win32-x64-" `
            --output "$dist/runtime-manifest-win32-x64.json"

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-win32-x64
          path: dist/win32-x64

  macos-arm64:
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build SenseVoice.cpp runtime
        run: npm run build:sensevoice -- --ref ${{ vars.ZCODE_SENSEVOICE_REF || 'main' }} --jobs 2

      - name: Build CAM++ ONNX Runtime adapter
        run: npm run build:campp -- --ref ${{ vars.ZCODE_3D_SPEAKER_REF || 'main' }} --ort-version 1.12.0 --jobs 2

      - name: Run JavaScript tests and plugin validation
        run: |
          npm run test:voice-transcriber
          npm run validate

      - name: Verify macOS runtime files
        run: |
          test -x plugins/voice-transcriber/bin/darwin/arm64/sense-voice-main
          test -x plugins/voice-transcriber/bin/darwin/arm64/campp-adapter
          test -f plugins/voice-transcriber/bin/darwin/arm64/libonnxruntime.1.12.0.dylib
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"unknown","params":{}}' \
            | plugins/voice-transcriber/bin/darwin/arm64/campp-adapter --stdio

      - name: Prepare macOS release assets
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          runtime="plugins/voice-transcriber/bin/darwin/arm64"
          dist="dist/darwin-arm64"
          mkdir -p "$dist"
          (cd "$runtime" && zip -q -r "$GITHUB_WORKSPACE/$dist/voice-transcriber-darwin-arm64.zip" .)
          find "$runtime" -maxdepth 1 -type f ! -name '*.pdb' -exec sh -c 'for file do cp "$file" "$0/darwin-arm64-$(basename "$file")"; done' "$dist" {} +
          node tools/create-runtime-manifest.mjs \
            --input "$runtime" \
            --version "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --asset-prefix "darwin-arm64-" \
            --output "$dist/runtime-manifest-darwin-arm64.json"

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-darwin-arm64
          path: dist/darwin-arm64

  publish:
    runs-on: ubuntu-latest
    needs: [windows-x64, macos-arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: release-assets

      - name: Merge platform runtime manifests
        run: |
          node tools/merge-runtime-manifests.mjs \
            --input release-assets \
            --output release-assets/runtime-manifest.json
          find release-assets -type f -name 'runtime-manifest-*.json' -delete

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "voice-transcriber $RELEASE_TAG" \
              --generate-notes
          fi
