name: Build macOS voice runtime

on:
  workflow_dispatch:
  push:
    paths:
      - "plugins/voice-transcriber/native/**"
      - "plugins/voice-transcriber/scripts/**"
      - "plugins/voice-transcriber/tests/**"
      - "plugins/voice-transcriber/.mcp.json"
      - "plugins/voice-transcriber/.zcode-plugin/**"
      - "plugins/voice-transcriber/skills/**"
      - "plugins/voice-transcriber/package.json"
      - "plugins/voice-transcriber/package-lock.json"
      - "tools/build-voice-plugin.mjs"
      - "tools/build-*.mjs"
      - "tools/build-ffmpeg.sh"
      - "package.json"
      - ".github/workflows/build-macos.yml"

jobs:
  macos-arm64:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install plugin build dependencies
        run: npm install --prefix plugins/voice-transcriber --ignore-scripts

      - name: Build bundled MCP server
        run: npm run build:voice-plugin

      - name: Build minimal redistributable ffmpeg
        run: npm run build:ffmpeg

      - name: Build official SenseVoice runtime
        run: npm run build:sensevoice -- --ref ${{ vars.ZCODE_SENSEVOICE_REF || 'runtime-llamacpp-v0.1.9' }} --native on --jobs 2

      - name: Build CAM++ ONNX Runtime adapter
        run: npm run build:campp -- --ref ${{ vars.ZCODE_3D_SPEAKER_REF || '065629c313eaf1a01c65c640c46d77e61e9607b4' }} --ort-version 1.12.0 --jobs 2

      - name: Run JavaScript tests and plugin validation
        run: |
          npm run test:voice-transcriber
          npm run validate

      - name: Verify macOS runtime files
        run: |
          test -x plugins/voice-transcriber/bin/darwin/arm64/llama-funasr-sensevoice
          test -x plugins/voice-transcriber/bin/darwin/arm64/campp-adapter
          test -x plugins/voice-transcriber/bin/darwin/arm64/ffmpeg
          test -f plugins/voice-transcriber/bin/darwin/arm64/libonnxruntime.1.12.0.dylib
          plugins/voice-transcriber/bin/darwin/arm64/ffmpeg -version >/dev/null
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"unknown","params":{}}' \
            | plugins/voice-transcriber/bin/darwin/arm64/campp-adapter --stdio

      - name: Ad-hoc sign macOS runtime
        run: |
          runtime="plugins/voice-transcriber/bin/darwin/arm64"
          codesign --force --sign - "$runtime/libonnxruntime.1.12.0.dylib"
          codesign --force --sign - "$runtime/llama-funasr-sensevoice"
          codesign --force --sign - "$runtime/campp-adapter"
          codesign --force --sign - "$runtime/ffmpeg"
          codesign --verify --strict "$runtime/llama-funasr-sensevoice"
          codesign --verify --strict "$runtime/campp-adapter"
          codesign --verify --strict "$runtime/ffmpeg"

      - name: Package macOS runtime
        run: |
          cd plugins/voice-transcriber/bin/darwin/arm64
          zip -q -r "$GITHUB_WORKSPACE/voice-transcriber-darwin-arm64.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: voice-transcriber-darwin-arm64
          path: voice-transcriber-darwin-arm64.zip
